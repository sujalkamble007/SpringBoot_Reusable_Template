services:
  db:
    image: postgres:16-alpine
    container_name: template-db
    environment:
      POSTGRES_DB: templatedb
      POSTGRES_USER: template_user
      POSTGRES_PASSWORD: template_pass
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U template_user -d templatedb"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata: